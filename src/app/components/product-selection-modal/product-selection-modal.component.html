<div class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl mx-4 p-6 flex flex-col max-h-[90vh]">
    <!-- Modal Header -->
    <div class="flex items-center justify-between pb-4 border-b border-gray-200 mb-4">
      <h2 class="text-2xl font-semibold text-gray-800">Sélectionner les produits à synchroniser</h2>
      <button (click)="closeModal.emit()" class="text-gray-400 hover:text-gray-600">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <!-- Filters Section -->
    <div class="bg-white rounded-lg shadow-sm border mb-4 p-4">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
        <!-- Search Bar -->
        <div>
          <label class="flex items-center text-sm font-medium text-gray-700 mb-1">
            <i class="fas fa-search mr-2"></i>
            Rechercher un produit
          </label>
          <input
            type="text"
            placeholder="Nom du produit..."
            [(ngModel)]="searchName"
            (input)="applyFilters()"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
          />
        </div>

        <!-- Dynamic Filter Groups -->
        <div *ngFor="let group of filterGroups; let i = index" class="border border-gray-200 rounded-lg p-3">
          <div class="flex items-center justify-between mb-2">
            <h3 class="flex items-center text-sm font-medium text-gray-700">
              <i [class]="group.icon + ' mr-2'"></i>
              {{ group.name }}
            </h3>
            <label class="flex items-center text-xs text-blue-600 cursor-pointer">
              <input
                type="checkbox"
                [(ngModel)]="group.selectAll"
                (change)="toggleSelectAllFilters(i)"
                class="mr-1 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
              />
              Tout sélectionner
            </label>
          </div>
          <div class="space-y-1">
            <label *ngFor="let option of group.options" class="flex items-center cursor-pointer">
              <input
                type="checkbox"
                [(ngModel)]="option.checked"
                (change)="updateFilterSelectAllState(i)"
                class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
              />
              <span class="text-sm text-gray-700">{{ option.label }}</span>
            </label>
          </div>
        </div>

        <!-- Categories Filter -->
        <div *ngIf="categoryFilters.length > 0" class="border border-gray-200 rounded-lg p-3">
          <div class="flex items-center justify-between mb-2">
            <h3 class="flex items-center text-sm font-medium text-gray-700">
              <i class="fas fa-list mr-2"></i>
              Catégories
            </h3>
            <label class="flex items-center text-xs text-blue-600 cursor-pointer">
              <input
                type="checkbox"
                [(ngModel)]="categoriesSelectAll"
                (change)="toggleCategoriesSelectAll()"
                class="mr-1 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
              />
              Tout sélectionner
            </label>
          </div>
          <div class="space-y-1 max-h-24 overflow-y-auto">
            <label *ngFor="let category of categoryFilters" class="flex items-center cursor-pointer">
              <input
                type="checkbox"
                [(ngModel)]="category.checked"
                (change)="updateCategoriesSelectAllState()"
                class="mr-2 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
              />
              <span class="text-sm text-gray-700">{{ category.label }}</span>
            </label>
          </div>
        </div>
      </div>
      <!-- Results Summary & Reset -->
      <div class="flex items-center justify-between text-sm text-gray-600 pt-4 border-t border-gray-200">
        <span>{{ filteredProducts.length }} produit(s) filtré(s)</span>
        <button
          (click)="resetFilters()"
          class="flex items-center space-x-2 px-3 py-1 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors text-xs"
        >
          <i class="fas fa-undo"></i>
          <span>Réinitialiser les filtres</span>
        </button>
      </div>
    </div>

    <!-- Products Table -->
    <div class="flex-grow overflow-hidden bg-white rounded-lg shadow-sm border">
      <div class="overflow-x-auto h-full">
        <div class="overflow-y-auto max-h-[50vh]">
            <table class="w-full">
                <thead class="bg-gray-50 border-b sticky top-0 z-10">
                    <tr>
                        <th class="px-6 py-3 text-left">
                            <label class="flex items-center cursor-pointer">
                                <input
                                    type="checkbox"
                                    [(ngModel)]="selectAllProducts"
                                    (change)="toggleSelectAllProducts()"
                                    class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                />
                                <span class="ml-2 text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Sélectionner tout
                                </span>
                            </label>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Image</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nom</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Prix</th>
                        <!-- <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stock</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">En solde</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Vedette</th> -->
                        <!-- <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Catégories</th> -->
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200 ">
                    <tr *ngFor="let p of filteredProducts"
                            class="hover:bg-gray-50 transition-colors"
                            [class.bg-blue-50]="isProductSelected(p.wooCommerceId)">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <label class="cursor-pointer">
                                <input
                                    type="checkbox"
                                    [checked]="isProductSelected(p.wooCommerceId)"
                                    (change)="toggleProductSelection(p.wooCommerceId)"
                                    class="rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                />
                            </label>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <img
                                [src]="p.imageUrl || '/placeholder.svg?height=48&width=48'"
                                [alt]="p.name || 'Product image'"
                                class="h-12 w-12 rounded-lg object-cover shadow-sm"
                                loading="lazy"
                            />
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-gray-900 max-w-xs truncate" [title]="p.name">
                                {{ p.name || 'Sans nom' }}
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900">
                                {{ p.price || '0' }} {{ p.currency || 'EUR' }}
                            </div>
                        </td>
                        <!-- <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full"
                                        [ngClass]="{
                                            'bg-green-100 text-green-800': p.status === 'publish',
                                            'bg-yellow-100 text-yellow-800': p.status === 'draft',
                                            'bg-gray-100 text-gray-800': p.status === 'private'
                                        }">
                                {{ p.status || 'N/A' }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="inline-flex items-center px-2 py-1 text-xs font-medium rounded-full"
                                        [ngClass]="{
                                            'bg-green-100 text-green-800': p.availability === 'in stock',
                                            'bg-red-100 text-red-800': p.availability === 'out of stock'
                                        }">
                                <i class="fas fa-circle text-xs mr-1"></i>
                                {{ p.availability === 'in stock' ? 'En stock' : 'Rupture' }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="text-sm" [class]="p.on_sale ? 'text-orange-600 font-medium' : 'text-gray-600'">
                                <i *ngIf="p.on_sale" class="fas fa-percentage mr-1"></i>
                                {{ p.on_sale ? 'En solde' : 'Non' }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="text-sm" [class]="p.featured ? 'text-yellow-600 font-medium' : 'text-gray-600'">
                                <i *ngIf="p.featured" class="fas fa-star mr-1"></i>
                                {{ p.featured ? 'Vedette' : 'Non' }}
                            </span>
                        </td> -->
                        <!-- <td class="px-6 py-4">
                            <div class="text-sm text-gray-600 max-w-xs">
                                <span *ngIf="p.category"
                                            class="inline-block bg-gray-100 text-gray-800 px-2 py-1 rounded-full text-xs mr-1 mb-1">
                                    {{ p.category }}
                                </span>
                                <span *ngIf="!p.category" class="text-gray-400 italic">
                                    Aucune catégorie
                                </span>
                            </div>
                        </td> -->
                    </tr>
                </tbody>
            </table>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="flex justify-end pt-4 border-t border-gray-200 mt-4">
      <button
        (click)="submitSelection()"
        [disabled]="syncLoading || selectedProducts.size === 0"
        class="flex items-center space-x-2 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50"
      >
        <i class="fas fa-paper-plane" [class.fa-spin]="syncLoading"></i>
        <span>Soumettre les produits sélectionnés ({{ getSelectedCount() }})</span>
      </button>
    </div>
  </div>
</div>
